<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Temu 商品严选</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Temu 商品严选</h1>
      <p>先筛选 · 人工审核 · 再借用妙手ERP采集</p>
    </div>
    <span class="ai-zero" title="当前版本不调用AI接口">AI 0 次</span>
  </header>

  <main>
    <section class="card form-card">
      <label for="keywords">1、搜索关键词</label>
      <textarea id="keywords" rows="5" spellcheck="false"></textarea>

      <label for="filterRules">2、商品筛选规则</label>
      <textarea id="filterRules" rows="6" spellcheck="false"></textarea>

      <label for="limitRules">3、限制规则</label>
      <textarea id="limitRules" rows="7" spellcheck="false"></textarea>

      <div class="button-row">
        <button id="saveBtn" class="secondary">保存配置</button>
        <button id="resetBtn" class="ghost">恢复示例</button>
        <button id="scanBtn" class="primary">筛选</button>
      </div>
      <p class="hint">无法确定的候选会进入“需人工确认”，不会调用 AI 猜测。遇到 Temu 人机验证会自动暂停。</p>
    </section>

    <section id="statusCard" class="card status-card hidden">
      <div class="status-head">
        <strong id="statusTitle">准备中</strong>
        <span id="taskId" class="mono"></span>
      </div>
      <div class="progress"><div id="progressBar"></div></div>
      <div id="statusText" class="status-text"></div>
      <div class="button-row compact">
        <button id="resumeBtn" class="primary hidden">继续当前任务</button>
        <button id="stopBtn" class="danger hidden">停止</button>
      </div>
    </section>

    <section id="resultsCard" class="card hidden">
      <div class="section-head">
        <div>
          <h2>筛选结果</h2>
          <div id="resultCounts" class="muted"></div>
        </div>
        <label class="switchline"><input type="checkbox" id="showExcluded" /> 显示已排除</label>
      </div>
      <div class="button-row sticky-actions">
        <button id="selectAllBtn" class="secondary">全选可采集</button>
        <button id="collectBtn" class="primary">执行采集</button>
        <button id="exportBtn" class="ghost">导出JSON</button>
      </div>
      <div id="resultList" class="result-list"></div>
    </section>

    <section class="card">
      <details>
        <summary>任务归档</summary>
        <div class="history-tools">
          <select id="taskHistory"></select>
          <button id="loadTaskBtn" class="secondary">打开任务</button>
          <button id="deleteTaskBtn" class="ghost danger-text">删除任务</button>
        </div>
      </details>
    </section>

    <section class="card">
      <details>
        <summary>高级设置 / 妙手适配</summary>
        <label for="miaoshouSelector">妙手“采集此产品”按钮 CSS 选择器（可留空）</label>
        <input id="miaoshouSelector" type="text" placeholder="例如 .xxx .collect-btn" />
        <label for="collectDelay">每件采集间隔（毫秒）</label>
        <input id="collectDelay" type="number" min="800" max="15000" step="100" value="2500" />
        <p class="hint">默认会按按钮文字自动识别；只有妙手改版导致识别失败时才需要填写选择器。</p>
      </details>
    </section>
  </main>

  <div id="toast" class="toast hidden"></div>
  <script src="lib/rules.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
