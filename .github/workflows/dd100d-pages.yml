name: Deploy dd100d preview to GitHub Pages
on:
  push:
    branches:
      - dd100d
    paths:
      - 'dd100d/preview/**'
      - '.github/workflows/dd100d-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: dd100d-github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dd100d
        uses: actions/checkout@v4
      - name: Upload static preview
        uses: actions/upload-pages-artifact@v4
        with:
          path: dd100d/preview
      - name: Downloadable preview files (no Pages activation needed)
        uses: actions/upload-artifact@v4
        with:
          name: dd100d-local-preview
          path: dd100d/preview/
          retention-days: 30
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy Pages
        id: deploy
        uses: actions/deploy-pages@v4
