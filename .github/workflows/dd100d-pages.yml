name: Deploy dd100d preview to GitHub Pages
on:
  push:
    branches: [dd100d]
    paths:
      - 'dd100d/preview/**'
      - '.github/workflows/dd100d-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: dd100d-github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dd100d
        uses: actions/checkout@v4
      - name: Prepare consistent published routes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/sitesignal/dd100d/preview"
          cp -a dd100d/preview/. "${RUNNER_TEMP}/sitesignal/"
          cp -a dd100d/preview/. "${RUNNER_TEMP}/sitesignal/dd100d/preview/"
          test -s "${RUNNER_TEMP}/sitesignal/index.html"
          test -s "${RUNNER_TEMP}/sitesignal/dd100d/preview/index.html"
          echo "Publishing SiteSignal as / and /dd100d/preview/"
      - name: Upload static preview
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/sitesignal
      - name: Downloadable preview files (no Pages activation needed)
        uses: actions/upload-artifact@v4
        with:
          name: dd100d-local-preview
          path: dd100d/preview/
          retention-days: 30
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy Pages
        id: deploy
        uses: actions/deploy-pages@v4
      - name: Check public URLs
        shell: bash
        run: |
          set -euo pipefail
          origin="https://ltre.github.io/Ltre.biz"
          for page in "/" "/dd100d/preview/"; do
            echo "Checking ${origin}${page}"
            valid=0
            for attempt in 1 2 3 4 5 6; do
              if curl --fail --location --silent --show-error --max-time 15 "${origin}${page}" -o /tmp/page.html && grep -Eiq 'SiteSignal|site.?signal' /tmp/page.html; then
                valid=1
                echo "OK: ${origin}${page}"
                break
              fi
              sleep 4
            done
            if [ "$valid" -ne 1 ]; then
              echo "::error::Public preview not yet responding at ${origin}${page}"
              exit 1
            fi
          done
